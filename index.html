<!DOCTYPE html>
<html lang="de">
<head>
<meta name="google" content="notranslate">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Signage – Osman Gazi Moschee Ulm</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { accent: '#009972', accentDark: '#007a5b' },
        fontFamily: { sans: ['"Open Sans"', 'sans-serif'] },
      }
    }
  }
</script>
<style>
  :root { --accent:#009972; }
  body { 
    margin:0; padding:0; height:100vh; 
    background:#e7eae9; 
    display: flex; align-items: center; justify-content: center;
    overflow:hidden; font-family:"Open Sans",sans-serif; 
  }
  
  .tnum { font-variant-numeric: tabular-nums; }

  #stage {
    position: relative;
    width: 1920px; height: 1080px;
    background: #ffffff;
    overflow: hidden;
    box-shadow: 0 40px 120px rgba(0,0,0,.35);
    flex-shrink: 0;
  }

  .pattern { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; }
  .card { background:#ffffff; border-radius:24px; box-shadow:0 8px 30px rgba(15,40,32,.06); }

  /* Intelligentes Ticker-Verhalten */
  @keyframes ticker { 0% { transform:translateX(0); } 100% { transform:translateX(-100%); } }
  .ticker-animate { display:inline-block; padding-left:100%; animation:ticker 45s linear infinite; }

  .slide { position:absolute; inset:0; opacity:0; transition:opacity 1.2s ease-in-out; background-size:contain; background-repeat:no-repeat; background-position:center; background-color:#ffffff; }
  .slide.active { opacity:1; }

  .pulse { animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1; transform:scale(1);} 50% { opacity:.35; transform:scale(.85);} }
</style>
</head>
<body>

<div id="stage">
  <svg class="pattern" xmlns="http://www.w3.org/2000/svg">
    <defs><pattern id="geo" width="110" height="110" patternUnits="userSpaceOnUse"><g fill="none" stroke="#009972" stroke-width="1.1" opacity="0.05"><path d="M55 10 L100 55 L55 100 L10 55 Z"/><path d="M25 25 L85 25 L85 85 L25 85 Z"/></g></pattern></defs>
    <rect width="100%" height="100%" fill="url(#geo)"/>
  </svg>

  <div class="relative z-10 h-full w-full grid p-10 gap-10" style="grid-template-columns: 1fr 720px;">

    <!-- LINKE SEITE: Kopf, Gebetszeiten, Nächstes Gebet, Ticker -->
    <div class="grid gap-8 min-h-0" style="grid-template-rows: 120px minmax(0,1fr) 90px;">

      <header class="card grid grid-cols-3 items-center px-10">
        <div class="flex items-center gap-4">
          <div class="flex items-center justify-center w-14 h-14 rounded-2xl overflow-hidden shrink-0">
            <img src="logo2.png" alt="Logo" class="w-full h-full object-contain bg-white">
          </div>
          <div>
            <div class="text-[30px] font-extrabold leading-none text-black">Ulm</div>
            <div class="text-[13px] font-medium text-gray-500 tracking-[.22em] uppercase mt-1">Osman Gazi Moschee</div>
          </div>
        </div>
        <div class="flex flex-col items-center">
          <div id="clock" class="tnum text-[58px] font-extrabold text-black leading-none">00:00:00</div>
          <div class="text-[12px] font-semibold tracking-[.3em] uppercase text-accent mt-1">Aktuelle Uhrzeit</div>
        </div>
        <div class="flex flex-col items-end gap-2">
          <div class="flex items-baseline gap-3">
            <span class="text-[12px] font-bold text-gray-400 uppercase tracking-wide">Gregorianisch</span>
            <span id="g-date" class="text-[19px] font-bold text-black">–</span>
          </div>
          <div class="flex items-baseline gap-3">
            <span class="text-[12px] font-bold text-accent uppercase tracking-wide">Hicri</span>
            <span id="h-date" class="text-[19px] font-bold text-black">–</span>
          </div>
        </div>
      </header>

      <!-- Hauptbereich: Gebetszeiten-Liste | Nächstes Gebet -->
      <div class="grid gap-8 min-h-0" style="grid-template-columns: 1.2fr 1fr;">

        <div class="card flex flex-col px-8 py-7 overflow-hidden">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-[30px] font-extrabold text-black">Namaz Vakitleri</h2>
            <span class="text-[14px] font-semibold text-gray-400" id="g-date-short">Wird geladen...</span>
          </div>
          <div id="prayer-list" class="flex flex-col justify-between flex-1 min-h-0">
             </div>
        </div>

        <div class="card flex flex-col text-white relative overflow-hidden p-8" style="background:linear-gradient(180deg,#00a47a,#007a5b);">
          <div class="flex items-center justify-center gap-3">
            <span class="w-3 h-3 rounded-full bg-white pulse"></span>
            <span class="text-[16px] font-bold tracking-[.3em] uppercase opacity-80">Sıradaki / Nächstes</span>
          </div>

          <div class="text-center mt-5">
            <div id="next-name-tr" class="text-[54px] font-extrabold uppercase leading-none">--</div>
            <div id="next-name-de" class="text-[26px] font-medium opacity-70 mt-1">--</div>
          </div>

          <div class="text-center mt-7">
            <div class="text-[15px] font-bold tracking-[.3em] uppercase opacity-70">Beginnt um</div>
            <div id="next-time" class="tnum text-[96px] font-extrabold tracking-tight leading-none mt-1">00:00</div>
          </div>

          <div class="flex items-center justify-center gap-3 mt-5">
            <span class="text-[15px] font-bold tracking-[.2em] uppercase opacity-70">noch</span>
            <span id="countdown" class="tnum text-[40px] font-extrabold">00:00:00</span>
          </div>

          <!-- Sabah (Morgengebet) & Cuma (Freitagsgebet = Mittag) -->
          <div class="mt-auto pt-6">
            <div class="flex items-center gap-4 mb-4 opacity-60">
              <div class="h-px flex-1 bg-white/40"></div>
              <span class="text-[12px] font-bold uppercase tracking-[.25em]">Ayrıca / Außerdem</span>
              <div class="h-px flex-1 bg-white/40"></div>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div class="flex items-center gap-3 bg-white/15 rounded-2xl px-4 py-4">
                <svg class="shrink-0" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 18a5 5 0 0 0-10 0"/><line x1="12" y1="9" x2="12" y2="2"/><line x1="4.2" y1="10.2" x2="5.6" y2="11.6"/><line x1="1" y1="18" x2="3" y2="18"/><line x1="21" y1="18" x2="23" y2="18"/><line x1="18.4" y1="11.6" x2="19.8" y2="10.2"/><polyline points="8 6 12 2 16 6"/><line x1="1" y1="22" x2="23" y2="22"/></svg>
                <div class="min-w-0">
                  <div class="text-[13px] font-bold uppercase tracking-[.12em] opacity-70 leading-tight">Sabah<br><span class="opacity-80">Morgengebet</span></div>
                  <div id="sabah-time-highlight" class="tnum text-[32px] font-extrabold leading-none mt-1">--:--</div>
                </div>
              </div>
              <div class="flex items-center gap-3 bg-white/15 rounded-2xl px-4 py-4">
                <svg class="shrink-0" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h3"/><path d="M8 18h6"/></svg>
                <div class="min-w-0">
                  <div class="text-[13px] font-bold uppercase tracking-[.12em] opacity-70 leading-tight">Cuma<br><span class="opacity-80">Freitagsgebet</span></div>
                  <div id="cuma-time" class="tnum text-[32px] font-extrabold leading-none mt-1">--:--</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <footer class="card flex items-center overflow-hidden px-0">
        <div class="flex items-center gap-4 h-full px-8 text-white shrink-0" style="background:var(--accent);">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l14-7v16L3 13z"/><path d="M3 11v2a2 2 0 0 0 2 2h1"/><path d="M8 15v3a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1v-2"/></svg>
          <div class="leading-tight">
            <div class="text-[22px] font-bold uppercase tracking-wide">Ankündigungen</div>
            <div class="text-[13px] font-medium uppercase tracking-[.2em] opacity-80">Duyurular</div>
          </div>
        </div>
        <div id="ticker-container" class="overflow-hidden flex-1 h-full flex items-center">
          <div id="ticker-text" class="text-[28px] font-semibold whitespace-nowrap px-6">Wird geladen...</div>
        </div>
      </footer>
    </div>

    <!-- RECHTE SEITE: Slideshow über volle Höhe (Hoch-/1:1-/4:3-Formate) -->
    <section class="card relative flex flex-col overflow-hidden bg-white">
      <div id="slideshow" class="absolute inset-0 bottom-14"></div>
      <div class="absolute inset-x-0 bottom-0 h-14 flex justify-center items-center z-20 bg-gray-50 border-t border-gray-100">
        <div id="dots" class="flex gap-4"></div>
      </div>
    </section>
  </div>
</div>

<script src="script.js?v=9"></script>
</body>
</html>
