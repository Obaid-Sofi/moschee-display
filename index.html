<!DOCTYPE html>
<html lang="de">
<head>
<meta name="google" content="notranslate">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Signage-Display: immer frisches HTML laden, kein alter Cache -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Digital Signage – Osman Gazi Moschee Ulm</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { accent: '#009972', accentDark: '#007a5b' },
        fontFamily: { sans: ['"Open Sans"', 'sans-serif'] },
      }
    }
  }
</script>
<style>
  :root { --accent:#009972; }
  body { 
    margin:0; padding:0; height:100vh; 
    background:#e7eae9; 
    display: flex; align-items: center; justify-content: center;
    overflow:hidden; font-family:"Open Sans",sans-serif; 
  }
  
  .tnum { font-variant-numeric: tabular-nums; }

  #stage {
    position: relative;
    width: 1920px; height: 1080px;
    background: #ffffff;
    overflow: hidden;
    box-shadow: 0 40px 120px rgba(0,0,0,.35);
    flex-shrink: 0;
  }

  .pattern { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; }
  .card { background:#ffffff; border-radius:24px; box-shadow:0 8px 30px rgba(15,40,32,.06); }

  .slide { position:absolute; inset:0; opacity:0; transition:opacity 1.2s ease-in-out; background-size:contain; background-repeat:no-repeat; background-position:center; background-color:#ffffff; }
  .slide.active { opacity:1; }

  .pulse { animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1; transform:scale(1);} 50% { opacity:.35; transform:scale(.85);} }
</style>
</head>
<body>

<div id="stage">
  <svg class="pattern" xmlns="http://www.w3.org/2000/svg">
    <defs><pattern id="geo" width="110" height="110" patternUnits="userSpaceOnUse"><g fill="none" stroke="#009972" stroke-width="1.1" opacity="0.05"><path d="M55 10 L100 55 L55 100 L10 55 Z"/><path d="M25 25 L85 25 L85 85 L25 85 Z"/></g></pattern></defs>
    <rect width="100%" height="100%" fill="url(#geo)"/>
  </svg>

  <div class="relative z-10 h-full w-full grid p-10 gap-10" style="grid-template-columns: 1fr 720px;">

    <!-- LINKE SEITE: Kopf, Gebetszeiten, Nächstes Gebet -->
    <div class="grid gap-8 min-h-0" style="grid-template-rows: 120px minmax(0,1fr);">

      <header class="card flex items-center justify-between px-10">
        <div class="flex items-center gap-4">
          <div class="flex items-center justify-center w-16 h-16 rounded-2xl overflow-hidden shrink-0">
            <img src="logo2.png" alt="Logo" class="w-full h-full object-contain bg-white">
          </div>
          <div>
            <div class="text-[34px] font-extrabold leading-none text-black">Ulm</div>
            <div class="text-[14px] font-medium text-gray-500 tracking-[.22em] uppercase mt-1">Osman Gazi Moschee</div>
          </div>
        </div>
        <div class="flex flex-col items-end">
          <div id="clock" class="tnum text-[76px] font-extrabold text-black leading-none">00:00:00</div>
          <div class="text-[12px] font-semibold tracking-[.3em] uppercase text-accent mt-1">Aktuelle Uhrzeit</div>
        </div>
      </header>

      <!-- Hauptbereich: Gebetszeiten-Liste | Nächstes Gebet -->
      <div class="grid gap-6 min-h-0" style="grid-template-columns: 1.9fr 1fr;">

        <div class="card flex flex-col px-5 py-7 overflow-hidden">
          <div id="prayer-list" class="flex flex-col gap-2 flex-1 min-h-0">
             </div>
        </div>

        <div class="card flex flex-col text-white relative overflow-hidden p-10" style="background:linear-gradient(180deg,#00a47a,#007a5b);">
          <div class="flex items-center justify-center gap-3">
            <span class="w-3 h-3 rounded-full bg-white pulse"></span>
            <span class="text-[16px] font-bold tracking-[.3em] uppercase opacity-80">Nächstes / Sıradaki</span>
          </div>

          <div class="text-center mt-9">
            <div id="next-name-de" class="text-[44px] font-extrabold uppercase leading-none">--</div>
            <div id="next-name-tr" class="text-[24px] font-medium opacity-70 mt-2">--</div>
          </div>

          <div class="text-center mt-auto">
            <div class="text-[15px] font-bold tracking-[.3em] uppercase opacity-70">Beginnt um</div>
            <div id="next-time" class="tnum text-[100px] font-extrabold tracking-tight leading-none mt-2">00:00</div>
          </div>

          <div class="text-center mt-10">
            <div class="text-[15px] font-bold tracking-[.3em] uppercase opacity-70">noch</div>
            <div id="countdown" class="tnum text-[64px] font-extrabold leading-none mt-2">00:00:00</div>
          </div>

          <!-- Cuma (Freitagsgebet = Mittag) -->
          <div class="mt-auto pt-10">
            <div class="flex items-center gap-4 mb-6 opacity-60">
              <div class="h-px flex-1 bg-white/40"></div>
              <span class="text-[12px] font-bold uppercase tracking-[.25em]">Außerdem / Ayrıca</span>
              <div class="h-px flex-1 bg-white/40"></div>
            </div>
            <div class="rounded-2xl bg-white/10 px-6 py-6 text-center"
                 style="box-shadow:inset 0 0 0 2px rgba(255,255,255,0.20);">
              <div class="text-[30px] font-extrabold leading-none">Freitagsgebet</div>
              <div class="text-[16px] font-semibold uppercase tracking-[.2em] opacity-75 mt-2">Cuma</div>
              <div id="cuma-time" class="tnum text-[56px] font-extrabold leading-none mt-3">--:--</div>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- RECHTE SEITE: Datum oben, Slideshow darunter (bündig mit linken Kacheln) -->
    <section class="grid gap-8 min-h-0" style="grid-template-rows: 120px minmax(0,1fr);">

      <!-- Datum: Gregorianisch & Hicri -->
      <div class="card flex flex-col justify-center px-10 gap-3">
        <div class="flex items-baseline justify-between gap-5">
          <span class="text-[24px] font-bold text-gray-400 shrink-0">Gregorianisch</span>
          <span id="g-date" class="text-[26px] font-extrabold text-black text-right">–</span>
        </div>
        <div class="h-px bg-gray-100"></div>
        <div class="flex items-baseline justify-between gap-5">
          <span class="text-[24px] font-bold text-accent shrink-0">Hicri</span>
          <span id="h-date" class="text-[26px] font-extrabold text-black text-right">–</span>
        </div>
      </div>

      <!-- Slideshow -->
      <div class="card relative overflow-hidden bg-white">
        <div id="slideshow" class="absolute inset-0"></div>
        <div class="absolute inset-x-0 bottom-5 flex justify-center z-20">
          <div id="dots" class="flex gap-3 rounded-full bg-black/10 px-4 py-2"></div>
        </div>
      </div>
    </section>
  </div>
</div>

<script src="script.js?v=17"></script>
</body>
</html>
